name: Validate MSDS public release

# 예전에는 고른 경로만 보았다. 그래서 label.html·sw.js·관리대장만 바꾼 커밋은
# 검증 없이 올라갔다. 이제 설명 문서(.md) 말고는 무엇이 바뀌어도 돈다.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      # 실제 브라우저(헤드리스 Chrome)로 검색·요약판·PDF·인쇄 단추·폰 폭을 눌러 본다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser smoke test
        run: node tests/browser/smoke.mjs

      - name: Screen files carry a fresh asset version
        run: python scripts/bump_asset_version.py --check

      # 제품 수 기준은 data/release-policy.json 에서 읽는다.
      - name: Validate public products, automatic summaries, and release manifest
        run: >-
          python scripts/validate_public_release.py
          --check-manifest data/release-manifest.json
