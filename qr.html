<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>MSDS 제품별 QR 코드 만들기</title>
    <link rel="stylesheet" href="css/qr.css?v=20260916-menu1">
    <link rel="stylesheet" href="css/topbar.css?v=20260916-menu1">
    <script>
      // 조회 화면에서 고른 화면 설정을 이 페이지에도 적용한다.
      try {
        var saved = localStorage.getItem("msds.theme.v1");
        var dark = saved ? saved === "dark"
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (error) { /* 저장소가 막힌 환경 */ }
    </script>
  </head>
  <body>
    <nav class="top-bar no-print" aria-label="화면 이동">
      <a class="top-bar-brand" href="index.html">MSDS 안전정보</a>
      <div class="top-bar-tabs">
        <a class="top-bar-tab" href="index.html">조회</a>
        <a class="top-bar-tab" href="label.html">경고표지</a>
        <a class="top-bar-tab" href="qr.html" aria-current="page">QR 코드</a>
      </div>
      <div class="top-bar-tools">
        <button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle-label">어두운 화면</span>
        </button>
      </div>
    </nav>

    <div class="page-intro no-print">
      <h1>제품별 QR 코드 만들기</h1>
      <p>용기·드럼통에 붙일 QR을 만듭니다. 스캔하면 그 제품의 MSDS 화면이 바로 열립니다.</p>
    </div>

    <main class="qr-main">
      <section class="qr-controls no-print" aria-label="QR 만들기 설정">
        <div class="qr-control-row">
          <label class="qr-field">
            <span>제품 찾기</span>
            <input id="qrSearch" type="search" placeholder="제품명, 업체, 용도로 좁히기" autocomplete="off">
          </label>
          <label class="qr-field qr-field-narrow">
            <span>QR 크기</span>
            <select id="qrSize">
              <option value="small">작게 (소분용기)</option>
              <option value="medium" selected>보통 (일반용기)</option>
              <option value="large">크게 (드럼통)</option>
            </select>
          </label>
        </div>

        <div class="qr-control-row">
          <button type="button" id="qrSelectAll" class="qr-button">보이는 제품 모두 선택</button>
          <button type="button" id="qrClear" class="qr-button qr-button-quiet">선택 해제</button>
          <button type="button" id="qrPrint" class="qr-button qr-button-primary">선택한 QR 인쇄</button>
          <span id="qrStatus" class="qr-status" role="status" aria-live="polite">데이터를 불러오는 중입니다.</span>
        </div>

        <p class="qr-hint">
          선택한 제품만 인쇄됩니다. 아무것도 선택하지 않으면 화면에 보이는 제품 전체가 인쇄됩니다.
          인쇄 미리보기에서 배율을 100%로 두어야 스캔이 잘 됩니다.
        </p>
      </section>

      <section id="qrSheet" class="qr-sheet qr-size-medium" aria-label="QR 목록"></section>
    </main>

    <script src="vendor/qrcode.min.js?v=20260916-menu1"></script>
    <script src="js/qr.js?v=20260916-menu1" defer></script>
    <script src="js/theme.js?v=20260916-menu1" defer></script>
  </body>
</html>
