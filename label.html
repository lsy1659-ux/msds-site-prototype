<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>MSDS 경고표지 만들기</title>
    <link rel="stylesheet" href="css/label.css?v=20260916-label1">
  </head>
  <body>
    <header class="label-header no-print">
      <div class="label-header-inner">
        <h1>경고표지 만들기</h1>
        <p>용기에 붙일 경고표지를 만듭니다. 명칭·그림문자·신호어·유해위험문구·예방조치문구·공급자정보 6개 항목으로 구성합니다.</p>
        <a class="label-back" href="index.html">← MSDS 조회로 돌아가기</a>
      </div>
    </header>

    <main class="label-main">
      <section class="label-controls no-print" aria-label="경고표지 설정">
        <div class="label-control-row">
          <label class="label-field">
            <span>제품 찾기</span>
            <input id="labelSearch" type="search" placeholder="제품명, 업체, 용도로 좁히기" autocomplete="off">
          </label>
          <label class="label-field label-field-narrow">
            <span>표지 크기</span>
            <select id="labelSize">
              <option value="small">소분용기 간이표시</option>
              <option value="medium" selected>일반용기 (A5 정도)</option>
              <option value="large">드럼통 (A4 정도)</option>
            </select>
          </label>
        </div>

        <div class="label-control-row">
          <button type="button" id="labelSelectAll" class="label-button">보이는 제품 모두 선택</button>
          <button type="button" id="labelClear" class="label-button label-button-quiet">선택 해제</button>
          <button type="button" id="labelPrint" class="label-button label-button-primary">선택한 표지 인쇄</button>
          <span id="labelStatus" class="label-status" role="status" aria-live="polite">데이터를 불러오는 중입니다.</span>
        </div>

        <p class="label-hint">
          선택한 제품만 인쇄됩니다. 아무것도 선택하지 않으면 화면에 보이는 제품 전체가 인쇄됩니다.
          소분용기 간이표시에는 전체 내용을 볼 수 있는 QR을 넣습니다.
        </p>
        <p class="label-warning">
          안전정보가 비어 있는 제품은 표지에 <b>확인 필요</b>로 표시됩니다. 그대로 붙이지 말고 MSDS 원문을 먼저 확인하세요.
        </p>
      </section>

      <section id="labelSheet" class="label-sheet label-size-medium" aria-label="경고표지 목록"></section>
    </main>

    <script src="vendor/qrcode.min.js?v=20260916-label1"></script>
    <script src="js/label.js?v=20260916-label1" defer></script>
  </body>
</html>
